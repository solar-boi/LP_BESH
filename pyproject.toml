[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lp-besh"
version = "0.1.0"
description = "Skeleton for calculating ComEd hourly pricing costs from customer interval data."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "LP BESH" }
]
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
app = [
  "altair>=5",
  "pandas>=2.2",
  "streamlit>=1.44",
]
dev = [
  "altair>=5",
  "pandas>=2.2",
  "pytest>=8",
  "streamlit>=1.44",
]

[project.scripts]
lp-besh = "lp_besh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
